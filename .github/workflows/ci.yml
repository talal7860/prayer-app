name: CI

on:
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn format:check
      # Strict: typescript-eslint strict + stylistic type-checked rules, fails on any warning.
      - run: yarn lint
      - run: yarn test --ci
      - run: npx expo-doctor
