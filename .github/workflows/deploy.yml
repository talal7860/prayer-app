name: Deploy to TestFlight and Google Play

# Automatic deploys are disabled until the one-time setup in CLAUDE.md (CI / CD) is done.
# To turn them back on, uncomment the push trigger below.
on:
  # push:
  #   branches: [master]
  workflow_dispatch:

# One release at a time; a newer push to master waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  # One job per platform, so a failure on one doesn't hide (or fail) the other.
  deploy:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    env:
      EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # Builds on EAS with the credentials stored there (set up once, interactively, with
      # `eas build` or `eas credentials`), bumps the build number remotely, then submits:
      # iOS to TestFlight (needs the App Store Connect API key on EAS), Android to the Play
      # internal track (needs the Play service account key on EAS). --no-wait returns once
      # the build is queued; follow it on expo.dev.
      - run: >
          eas build
          --platform ${{ matrix.platform }}
          --profile production
          --auto-submit
          --non-interactive
          --no-wait
